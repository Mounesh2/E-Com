services:
  # ─── Django Backend (Web Service) ───────────────────────────────────────────
  - type: web
    name: trendify-backend
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py migrate &&
      python manage.py ensure_admin &&
      python manage.py seed_db &&
      python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_SxZBjeqfeMQyrE
      - key: RAZORPAY_KEY_SECRET
        value: x7qgpAIvS8yWRKxKVAUSTXQR
      - key: ADMIN_EMAIL
        value: admin@gmail.com
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: DATABASE_URL
        fromDatabase:
          name: trendify-db
          property: connectionString

  # ─── React Frontend (Static Site) ────────────────────────────────────────────
  - type: web
    name: trendify-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: trendify-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────────
  - name: trendify-db
    plan: free
    databaseName: trendify
    user: trendify_user
